<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOONATE POS 🌙 - CASHIER ONLY</title>
<meta name="theme-color" content="#111">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;800&display=swap');
*{font-family:'Poppins',Arial;margin:0;padding:0;box-sizing:border-box}
body{background:#111;color:white;padding-bottom:190px}
header{background:#E86A17;padding:14px;text-align:center;position:sticky;top:0;z-index:20}
header h1{font-size:20px}
header p{font-size:12px;font-weight:700}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px}
.stat{background:#222;border:1px solid #444;border-radius:12px;padding:10px;text-align:center}
.stat b{font-size:20px;color:#FF8C42;display:block}
.stat span{font-size:11px}
.tabs{display:flex;gap:8px;padding:0 10px 10px}
.tabs button{flex:1;padding:12px;border-radius:10px;border:none;font-weight:800;font-size:14px;background:#333;color:white}
.tabs button.active{background:#E86A17;color:white}
#pos-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.pos-btn{background:white;color:#111;border:none;border-radius:14px;padding:16px 10px;text-align:left;cursor:pointer;min-height:95px}
.pos-btn b{font-size:18px;line-height:1.2;display:block}
.pos-btn span{font-size:14px;color:#CC5500;font-weight:800;display:block;margin-top:6px}
.pos-btn small{font-size:12px;color:#666;display:block}
.pos-btn.out{background:#555;color:#999}
#sales-list{padding:10px;display:none}
.sale-card{background:#222;border:1px solid #444;border-radius:12px;padding:12px;margin-bottom:10px}
.sale-card b{font-size:18px;display:block}
.sale-card div{font-size:15px;line-height:1.7;margin-top:6px}
#stock-list{padding:10px;display:none}
.stock-row{background:white;color:#111;border-radius:12px;padding:12px;margin-bottom:10px}
.stock-row b{font-size:20px;display:block}
.stock-row span{font-size:15px;font-weight:800;color:#CC5500}
.stock-row div{display:flex;gap:6px;margin-top:8px}
.stock-row button{flex:1;padding:12px;border:none;border-radius:8px;font-weight:800;font-size:16px;color:white}
.till{position:fixed;bottom:0;left:0;right:0;background:white;color:#111;padding:12px;z-index:30;border-top:4px solid #E86A17;max-height:185px;overflow:auto}
.till h3{font-size:15px}
#till-items{font-size:14px;line-height:1.6;max-height:60px;overflow:auto}
#till-items button{padding:2px 8px;margin-left:6px}
.total-row{display:flex;justify-content:space-between;font-size:22px;font-weight:800;margin:6px 0}
.till-btns{display:flex;gap:8px}
.till-btns button{flex:1;padding:14px;border:none;border-radius:10px;font-weight:800;font-size:15px;color:white}
#login{position:fixed;top:0;left:0;right:0;bottom:0;background:#111;z-index:99;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:white;color:#111;border-radius:16px;padding:20px;width:100%;max-width:340px;text-align:center}
.login-box input{width:100%;padding:14px;margin:10px 0;border:1px solid #ccc;border-radius:10px;font-size:18px;text-align:center}
.login-box button{width:100%;padding:14px;background:#E86A17;color:white;border:none;border-radius:10px;font-weight:800;font-size:16px}
</style>
</head>
<body>

<div id="login">
<div class="login-box">
<div style="font-size:50px">🌙</div>
<h2>MOONATE POS</h2>
<p>CASHIER ONLY</p>
<input type="password" id="pin" placeholder="PIN - 5224">
<button onclick="checkPIN()">🔓 OPEN POS</button>
<p style="font-size:12px;color:#888;margin-top:10px">PIN: 5224<br><a href="index.html" style="color:#E86A17">← Back to Customer Menu</a></p>
</div>
</div>

<header><h1>🌙 MOONATE POS - CASHIER</h1><p>NO PICTURES - NAMES ONLY - TAP NAME TO SELL</p></header>

<div class="stats">
<div class="stat"><b id="stat-sales">R0</b><span>TODAY SALES</span></div>
<div class="stat"><b id="stat-orders">0</b><span>ORDERS</span></div>
<div class="stat"><b id="stat-stock">0</b><span>IN STOCK</span></div>
</div>

<div class="tabs">
<button id="tab-sell" class="active" onclick="showTab('sell')">🧾 SELL</button>
<button id="tab-sales" onclick="showTab('sales')">💰 SALES</button>
<button id="tab-stock" onclick="showTab('stock')">📦 STOCK</button>
</div>

<div id="pos-grid"></div>

<div id="sales-list"></div>
<div id="stock-list"></div>

<div class="till">
<h3>🧾 CURRENT SALE</h3>
<div id="till-items">No items - Tap a name above Boss</div>
<div class="total-row"><span>TOTAL:</span><span>R<span id="till-total">0</span></span></div>
<div class="till-btns">
<button style="background:#25D366" onclick="checkout('CASH')">💵 CASH</button>
<button style="background:#111" onclick="checkout('CARD')">💳 CARD</button>
<button style="background:#ff0000" onclick="clearTill()">🗑️ CLEAR</button>
</div>
</div>

<script>
const defaultMenu=[
{id:3,name:"Dackwood",price:80,stock:25},
{id:4,name:"2 Hot Dogs - KIDS",price:70,stock:30},
{id:5,name:"Giant Steak Roll",price:140,stock:12},
{id:6,name:"Giant Chicken Roll",price:140,stock:12},
{id:7,name:"Classic Burger + Chips",price:55,stock:40},
{id:8,name:"Cheese Burger + Chips",price:65,stock:35},
{id:14,name:"MEGA BURGER + Chips",price:90,stock:15},
{id:15,name:"DOUBLE CHEESE JUMBO",price:100,stock:15},
{id:9,name:"4 Cheese Burger + Fries",price:160,stock:8},
{id:10,name:"Kota Rekamo",price:50,stock:20},
{id:11,name:"Kota Moonate",price:70,stock:20},
{id:12,name:"Chicken + Pap + Chakalaka",price:75,stock:15},
{id:13,name:"Quarter Chicken + Chips",price:65,stock:15},
{id:1,name:"Sneck Box",price:150,stock:20},
{id:2,name:"Pap + Steak + Wors",price:80,stock:15}
];
let menu=JSON.parse(localStorage.getItem('moonate_menu'))||defaultMenu;
let sales=JSON.parse(localStorage.getItem('moonate_sales'))||[];
let till=[];
function saveMenu(){localStorage.setItem('moonate_menu',JSON.stringify(menu));}
function saveSales(){localStorage.setItem('moonate_sales',JSON.stringify(sales));}
function checkPIN(){if(document.getElementById('pin').value==='5224'){document.getElementById('login').style.display='none';}else{alert("Wrong PIN Boss! 5224");}}
function showTab(t){
document.getElementById('pos-grid').style.display=t==='sell'?'grid':'none';
document.getElementById('sales-list').style.display=t==='sales'?'block':'none';
document.getElementById('stock-list').style.display=t==='stock'?'block':'none';
document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
document.getElementById('tab-'+t).classList.add('active');
if(t==='sales')loadSales(); if(t==='stock')loadStock();
}
function loadGrid(){
let g=document.getElementById('pos-grid');g.innerHTML='';
menu.forEach(m=>{
let out=m.stock<=0;
g.innerHTML+=`<button class="pos-btn ${out?'out':''}" onclick="addTill(${m.id})"><b>${m.name}</b><span>R${m.price}</span><small>STOCK: ${m.stock} ${out?' - SOLD OUT':''}</small></button>`;
});
}
function addTill(id){
let m=menu.find(x=>x.id===id);
if(m.stock<=0){alert(m.name+" SOLD OUT Boss! Go STOCK +10");return;}
let ex=till.find(x=>x.id===id);
if(ex){if(ex.qty>=m.stock){alert("Only "+m.stock+" left Boss!");return;}ex.qty++;}
else till.push({id:m.id,name:m.name,price:m.price,qty:1});
updateTill();
}
function changeTill(id,d){let it=till.find(x=>x.id===id);if(!it)return;it.qty+=d;if(it.qty<=0)till=till.filter(x=>x.id!==id);updateTill();}
function clearTill(){till=[];updateTill();}
function updateTill(){
let total=till.reduce((s,c)=>s+c.price*c.qty,0);
document.getElementById('till-total').innerText=total;
if(till.length===0){document.getElementById('till-items').innerHTML='No items - Tap a name above Boss';return;}
document.getElementById('till-items').innerHTML=till.map(c=>`${c.name} x${c.qty} = R${c.price*c.qty} <button onclick="changeTill(${c.id},-1)">-</button><button onclick="changeTill(${c.id},1)">+</button>`).join('<br>');
}
function checkout(type){
if(till.length===0){alert("Till empty Boss!");return;}
let total=till.reduce((s,c)=>s+c.price*c.qty,0);
till.forEach(ci=>{let mi=menu.find(m=>m.id===ci.id);if(mi)mi.stock-=ci.qty;});
let order={id:'MN'+Date.now(),name:'WALK-IN',addr:'SHOP',note:'',items:[...till],sub:total,del:0,total:total,type:type,time:new Date().toLocaleString(),date:new Date().toDateString()};
sales.push(order);saveMenu();saveSales();
alert("SOLD ✅ R"+total+" - "+type+"\n"+till.map(c=>c.name+" x"+c.qty).join("\n"));
clearTill();loadGrid();updateStats();
}
function updateStats(){
let today=new Date().toDateString();
let ts=sales.filter(s=>s.date===today);
document.getElementById('stat-sales').innerText='R'+ts.reduce((s,x)=>s+x.total,0);
document.getElementById('stat-orders').innerText=ts.length;
document.getElementById('stat-stock').innerText=menu.reduce((s,m)=>s+m.stock,0);
}
function loadSales(){
let today=new Date().toDateString();
let ts=sales.filter(s=>s.date===today).reverse();
if(ts.length===0){document.getElementById('sales-list').innerHTML='<div class="sale-card">No sales today Boss. Start selling 🔥</div>';return;}
document.getElementById('sales-list').innerHTML=ts.map(s=>`<div class="sale-card"><b>${s.id} - R${s.total} (${s.type})</b><small>${s.time} - ${s.name}</small><div>${s.items.map(i=>'• '+i.name+' x'+i.qty+' = R'+(i.price*i.qty)).join('<br>')}</div></div>`).join('')+`<button onclick="clearSales()" style="width:100%;padding:14px;background:#ff0000;color:white;border:none;border-radius:10px;font-weight:800;margin-top:10px">🗑️ CLEAR TODAY SALES</button>`;
}
function loadStock(){
document.getElementById('stock-list').innerHTML=menu.map(m=>`<div class="stock-row"><b>${m.name}</b><span>R${m.price} | STOCK: ${m.stock}</span><div><button style="background:#25D366" onclick="updStock(${m.id},1)">+1</button><button style="background:#111" onclick="updStock(${m.id},-1)">-1</button><button style="background:#E86A17" onclick="updStock(${m.id},10)">+10</button></div></div>`).join('');
}
function updStock(id,d){let m=menu.find(x=>x.id===id);m.stock+=d;if(m.stock<0)m.stock=0;saveMenu();loadGrid();loadStock();updateStats();}
function clearSales(){if(confirm("Clear today sales Boss?")){sales=sales.filter(s=>s.date!==new Date().toDateString());saveSales();loadSales();updateStats();}}
loadGrid();updateTill();updateStats();
</script>
</body>
</html>
